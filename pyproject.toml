[project]
name = "mycoai-retrieval-backend"
version = "0.1.0"
description = "FastAPI backend for MycoAI retrieval services"
readme = "README.md"
authors = [
    { name = "datamonsterr", email = "phamthanhdat17092004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.135.3",
    "numpy>=2.3.0",
    "opencv-python-headless>=4.12.0.88",
    "pydantic-settings>=2.13.1",
    "qdrant-client>=1.15.0",
    "scikit-image>=0.25.2",
    "scipy>=1.16.0",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
mycoai-retrieval-backend = "mycoai_retrieval_backend.main:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mycoai_retrieval_backend"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mycoai_retrieval_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
