[project]
name = "mycoai-retrieval-backend"
version = "0.1.0"
description = "FastAPI backend for MycoAI retrieval services"
readme = "README.md"
authors = [
    { name = "datamonsterr", email = "phamthanhdat17092004@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.1",
    "asyncpg>=0.30.0",
    "celery>=5.5.1",
    "fastapi>=0.135.3",
    "numpy>=2.3.4",
    "opencv-python-headless>=4.11.0.86",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.13.1",
    "python-jose[cryptography]>=3.4.0",
    "python-multipart>=0.0.20",
    "qdrant-client>=1.13.3",
    "redis>=5.2.1",
    "sqlalchemy[asyncio]>=2.0.41",
    "uvicorn[standard]>=0.44.0",
]

[project.scripts]
mycoai-retrieval-backend = "mycoai_retrieval_backend.main:main"

[build-system]
requires = ["uv_build>=0.10.10,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "httpx>=0.28.1",
    "mypy>=1.20.0",
    "pytest>=9.0.3",
    "ruff>=0.15.10",
    "pytest-asyncio>=0.26.0",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["mycoai_retrieval_backend"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["mycoai_retrieval_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
